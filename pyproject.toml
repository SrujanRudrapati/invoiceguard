[project]
name = "invoiceguard"
version = "0.1.0"
description = "Invoice extraction with evidence, rule checks, and a Haiku -> Sonnet cascade"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic",
    "pydantic>=2",
    "pdfplumber",
    "reportlab",
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoiceguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts", "eval"]
markers = ["integration: end-to-end over generated PDFs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
